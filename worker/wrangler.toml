name = "fsp-ai"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
GEMINI_MODELS = "gemini-flash-lite-latest,gemini-flash-latest"
ALLOWED_ORIGINS = "https://osonfsp.github.io,http://localhost:5173,http://localhost:4173"
ADMIN_USERNAMES = "de_behzod"

# Ma'lumotlar bazasi: Durable Object + SQLite (store.js)
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# Bir IP uchun daqiqasiga 60 ta so'rov (spamdan himoya)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Bot: har 5 daqiqada — kunlik eslatma va kun savoli, sinov/tarif eslatmasi, ommaviy xabar (bot.js runCron)
[triggers]
crons = ["*/5 * * * *"]
